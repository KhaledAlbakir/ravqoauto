<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicle | RAVQO Auto</title><link rel="stylesheet" href="styles.css"></head><body>

<div class="topbar">
 <div class="lang-switch"><button class="lang-btn" data-lang="ar">العربية</button><button class="lang-btn" data-lang="en">English</button></div>
 <div data-t="top">RAVQO Auto</div><div>SAR</div>
</div>
<header class="wrap header">
 <a class="logo" href="index.html">RAVQO<small>AUTO</small></a>
 <div class="search"><input data-t-placeholder="search" placeholder="Search ..."><button onclick="location.href='index.html#brands'">⌕</button></div>
 <div class="actions">
  <button class="actionBtn" data-open-wishlist><span data-t="wishlist">Wishlist</span><i class="badge" data-wish-count>0</i></button>
  <button class="actionBtn" data-open-cart><span data-t="cart">Cart</span><i class="badge" data-cart-count>0</i></button>
 </div>
</header>
<nav><div class="wrap nav"><a class="" href="index.html" data-t="home">home</a><a class="active" href="index.html#brands" data-t="brands">brands</a></div></nav>

<main class="wrap section">
<div class="breadcrumbs"><a href="index.html" data-t="home">Home</a> ‹ <a id="brandLink"></a> ‹ <span id="modelCrumb"></span></div>
<section id="vehicleHeader" class="vehicleHeader panel" style="padding:20px"></section>
<h2 class="sectionTitle" style="margin-top:28px" data-t="parts">Part Categories</h2>
<div id="categoryGrid" class="categoryGrid"></div>
<div class="filters">
 <select id="yearSelect"><option value="" data-t="selectYear">Select Year</option></select>
 <select id="categorySelect"><option value="" data-t="selectCategory">Select Category</option></select>
 <select id="sortSelect"><option value="default">Default</option><option value="price-asc">Price ↑</option><option value="price-desc">Price ↓</option></select>
</div>
<h2 data-t="products">Products</h2>
<div id="productsGrid" class="productsGrid"></div>
</main>

<footer id="contact"><div class="wrap footerGrid">
 <div><div class="logo">RAVQO<small>AUTO</small></div><p>DRIVE WITH CONFIDENCE</p></div>
 <div><b>RAVQO Auto</b><a href="index.html">Home</a><a href="index.html#brands">Brands</a></div>
 <div><b>Customer Service</b><span>Shipping Policy</span><span>Return & Refund</span><span>Terms & Conditions</span></div>
 <div><b>Contact</b><a dir="ltr" href="tel:0592901998">0592901998</a><a href="mailto:Mr.khaledb1@gmail.com">Mr.khaledb1@gmail.com</a></div>
</div><div class="wrap copyright">© 2026 RAVQO Auto — All rights reserved.</div></footer>
<div id="drawer" class="drawer" hidden><div class="drawerHead"><h3 id="drawerTitle"></h3><button class="darkBtn" data-close-drawer>✕</button></div><div id="drawerBody"></div></div>
<a class="whatsapp" target="_blank" href="https://wa.me/966592901998">☎</a>

<script src="data.js"></script><script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const brand=getBrand(qs('brand'))||RAVQO_DATA.brands[0], model=getModel(brand,qs('model'))||brand.models[0];
 document.title=brand.name+' '+model.name+' | RAVQO Auto';
 document.getElementById('brandLink').textContent=brand.name;document.getElementById('brandLink').href='brand.html?brand='+brand.id;document.getElementById('modelCrumb').textContent=model.name;
 document.getElementById('vehicleHeader').innerHTML=`<img src="${model.image}"><div><h1>${brand.name} ${model.name}</h1><div class="vehicleMeta"><span class="chip">${t('vehicleType')}: ${model.body}</span>${model.years.map(y=>`<span class="chip">${y}</span>`).join('')}</div><p>${lang==='ar'?'اختر فئة القطعة أو سنة الموديل لتصفية النتائج':'Choose a part category or model year to filter results'}</p></div>`;
 const cg=document.getElementById('categoryGrid'); cg.innerHTML=RAVQO_DATA.categories.map(c=>`<button class="categoryCard" data-cat="${c.id}"><div class="icon">${c.icon}</div><h3>${lang==='ar'?c.ar:c.en}</h3></button>`).join('');
 const ys=document.getElementById('yearSelect'); model.years.forEach(y=>ys.insertAdjacentHTML('beforeend',`<option value="${y}">${y}</option>`));
 const cs=document.getElementById('categorySelect'); RAVQO_DATA.categories.forEach(c=>cs.insertAdjacentHTML('beforeend',`<option value="${c.id}">${lang==='ar'?c.ar:c.en}</option>`));
 function render(){
  let list=RAVQO_DATA.products.filter(p=>p.brand===brand.id&&p.model===model.id);
  if(ys.value) list=list.filter(p=>p.years.includes(ys.value));
  if(cs.value) list=list.filter(p=>p.category===cs.value);
  if(document.getElementById('sortSelect').value==='price-asc') list.sort((a,b)=>a.price-b.price);
  if(document.getElementById('sortSelect').value==='price-desc') list.sort((a,b)=>b.price-a.price);
  const pg=document.getElementById('productsGrid');
  pg.innerHTML=list.length?list.map(p=>`<article class="productCard"><img src="${p.image}"><div class="productBody"><h3>${lang==='ar'?p.nameAr:p.nameEn}</h3><p>${catName(p.category)} • ${p.years.join(' / ')}</p><div class="price">${money(p.price)}</div><div class="productActions"><a class="goldBtn" href="product.html?id=${p.id}">${t('viewProduct')}</a><button class="darkBtn" onclick="addToWishlist('${p.id}')">♡</button></div></div></article>`).join(''):`<div class="empty">${t('noProducts')}</div>`;
 }
 render();
 cg.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cg.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');cs.value=b.dataset.cat;render();});
 ys.onchange=render;cs.onchange=render;document.getElementById('sortSelect').onchange=render;
});
</script></body></html>
