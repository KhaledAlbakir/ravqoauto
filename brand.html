<script>
document.addEventListener('DOMContentLoaded',()=>{
 const brand=getBrand(qs('brand'))||RAVQO_DATA.brands[0];
 document.title=brand.name+' | RAVQO Auto'; document.getElementById('crumbBrand').textContent=brand.name;
 document.getElementById('brandHero').innerHTML=`<img src="${brand.image}"><div><h1>${brand.name}</h1><p>${lang==='ar'?'اختر موديل سيارتك للوصول إلى فئات القطع المناسبة':'Choose your vehicle model to view compatible part categories'}</p></div>`;
 document.getElementById('modelsGrid').innerHTML=brand.models.map(m=>`<article class="modelCard"><img src="${m.image}"><div class="modelBody"><h3>${m.name}</h3><p>${t('vehicleType')}: ${m.body}</p><p>${t('years')}: ${m.years.join(' / ')}</p><a class="outlineBtn" href="vehicle.html?brand=${brand.id}&model=${m.id}">${t('viewParts')}</a></div></article>`).join('');
});
</script></body></html>
