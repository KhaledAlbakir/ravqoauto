document.addEventListener('DOMContentLoaded',()=>{const c=cart(), el=document.getElementById('cartPage');if(!c.length){el.innerHTML=`<div class="empty">${t('emptyCart')}</div>`;return;}let total=0;el.innerHTML=c.map(x=>{const p=getProduct(x.id);total+=p.price*x.qty;return `<div class="drawerItem"><img src="${p.image}"><div><b>${lang==='ar'?p.nameAr:p.nameEn}</b><small>${x.qty} × ${money(p.price)}</small></div><button class="dangerBtn" onclick="removeCart('${p.id}');location.reload()">${t('remove')}</button></div>`}).join('')+`<h3>${t('subtotal')}: ${money(total)}</h3>`;});</script></body></html>
