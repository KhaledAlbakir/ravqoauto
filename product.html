<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | RAVQO Auto</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div class="lang"><button class="lang-btn" data-lang="ar">العربية</button><button class="lang-btn" data-lang="en">English</button></div><div>RAVQO Auto</div><div>SAR</div></div>
<header class="wrap header"><a class="logo" href="index.html">RAVQO<small>AUTO</small></a><div class="search"><input data-ph="search"><button>⌕</button></div><div class="actions"><button class="action" data-wish><span data-t="wishlist">Wishlist</span><i class="count" data-wish-count hidden></i></button><button class="action" data-cart><span data-t="cart">Cart</span><i class="count" data-cart-count hidden></i></button></div></header>
<div class="navbar"><nav class="wrap nav"><a href="index.html" data-t="home">Home</a><a href="vehicle.html" class="active" data-t="vehicle">Vehicle</a></nav></div><main class="wrap productPage"><div class="breadcrumbs"><a href="vehicle.html" data-t="back">Back</a> ‹ <span id="crumb"></span></div><section class="productTop"><div class="gallery"><div id="thumbs" class="thumbs"></div><div class="mainImage"><img id="main"></div></div><div class="productInfo"><h1 id="name"></h1><div id="enName" class="enName"></div><p id="desc" class="desc"></p><div class="specTable"><div class="specRow"><span data-t="brand">Brand</span><b id="brandV"></b></div><div class="specRow"><span data-t="model">Model</span><b id="modelV"></b></div><div class="specRow"><span data-t="year">Year</span><b id="yearV"></b></div><div class="specRow"><span data-t="vin">VIN</span><b id="vinV">—</b></div><div class="specRow"><span data-t="partType">Part Type</span><b id="catV"></b></div></div><div class="buyBar"><div><div id="price" class="bigPrice"></div><small data-t="priceVat"></small></div><div class="qty"><button id="minus">−</button><span id="qty">1</span><button id="plus">+</button></div></div><div class="buyActions"><button id="addC" class="goldBtn" data-t="addCart"></button><button id="addW" class="darkBtn" data-t="addWish"></button></div></div></section></main><footer><div class="wrap footer"><div><div class="logo">RAVQO<small>AUTO</small></div><p>DRIVE WITH CONFIDENCE</p></div><div><b>RAVQO Auto</b><a href="index.html">Home</a><a href="vehicle.html">Vehicle</a></div><div><b>Customer Service</b><span>Shipping Policy</span><span>Return & Refund</span><span>Terms & Conditions</span></div><div><b>Contact</b><a dir="ltr" href="tel:0592901998">0592901998</a><a href="mailto:Mr.khaledb1@gmail.com">Mr.khaledb1@gmail.com</a></div></div><div class="wrap copyright">© 2026 RAVQO Auto — All rights reserved.</div></footer>
<div id="drawer" class="drawer" hidden><div class="drawerHead"><h3 id="drawerTitle"></h3><button class="darkBtn" data-close>✕</button></div><div id="drawerBody"></div></div><script src="data.js"></script><script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search),p=getProduct(q.get('id'))||RAVQO_DATA.products[0],b=RAVQO_DATA.brands.find(x=>x.id===p.brand),cl=b.classes.find(x=>x.id===p.class),m=cl.models.find(x=>x.id===p.model),vin=q.get('vin')||'—';document.getElementById('crumb').textContent=lang==='ar'?p.nameAr:p.nameEn;document.getElementById('name').textContent=lang==='ar'?p.nameAr:p.nameEn;document.getElementById('enName').textContent=p.nameEn;document.getElementById('desc').textContent=lang==='ar'?p.descAr:p.descEn;document.getElementById('brandV').textContent=b.name;document.getElementById('modelV').textContent=m.name;document.getElementById('yearV').textContent=p.years.join(' / ');document.getElementById('vinV').textContent=vin;document.getElementById('catV').textContent=lang==='ar'?RAVQO_DATA.categories.find(c=>c.id===p.category).ar:RAVQO_DATA.categories.find(c=>c.id===p.category).en;document.getElementById('price').textContent=money(p.price);document.getElementById('main').src=p.images[0];document.getElementById('thumbs').innerHTML=p.images.map((im,i)=>`<button class="thumb ${i?'':'active'}" data-im="${im}"><img src="${im}"></button>`).join('');document.querySelectorAll('.thumb').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('main').src=btn.dataset.im});let qty=1,qe=document.getElementById('qty');document.getElementById('plus').onclick=()=>qe.textContent=++qty;document.getElementById('minus').onclick=()=>{if(qty>1)qty--;qe.textContent=qty};document.getElementById('addC').onclick=()=>addCart(p.id,qty);document.getElementById('addW').onclick=()=>addWish(p.id)});
</script></body></html>
